schema_version = "1.4"

[task]
name = "storygold/solidworks-0001-playstation-controller"
version = "1.0.0"
description = "Make design edits while preserving design intent and feature tree references"
keywords = ["solidworks", "cad", "design_iteration"]

[[task.authors]]
name = "StoryGold"

[metadata]
complete = true
program = "SolidWorks"
category = "design_iteration"
units = "mm"
human_baseline_minutes = 240
max_score = 4

notes = "PS3 controller (replaces the retired Xbox variant, whose surfacing broke during the engineer's edit). Mirror plane is x=80.5mm, not x=0. Grading is geometry-only and id/name-independent: roles (housing/dpad/face_buttons/ sticks/triggers/bumpers/centre) are assigned geometrically per capture. Widen is graded as mirror-pair separation growth (+15mm), robust to the housing remodel. Cluster positions are graded against the CANDIDATE'S own measured widening (not the 15mm target), so an unwidened-but-correctly-swapped part loses only the widen component, never the spacing one, while a diamond left where it was loses most of the spacing component (the mismatch cost is dominated by the cluster positions, not by the rigid internals). Baseline bodies are matched to candidate bodies by expected position with the body fingerprint breaking near-ties: the START/SELECT bodies are only 4.7cm apart, so position alone let a pair that never moved be paired with its mirror twin and read as correctly swapped. The naive-flip guard is the port-light glyph cluster (a one-sided housing feature re-found by its mirror-invariant area multiset, falling back to the seed geometric band -- mirror-invariant Y/Z plus tiny faces near the top-rear edge -- when mirroring or rebuilding the glyph drifts its face areas; it must stay on its original side AND move only by the widening) combined multiplicatively with the shell moment sign (judged by sign, with credit tapering through a collapsed asymmetry), so a wholesale geometric mirror zeroes the handedness component even though its clusters and inertia signs look mirrored -- and a cluster that cannot be found at all FAILS the guard instead of passing as unverifiable. Sides that a role centroid cannot witness (both diamonds straddle the plane, every shoulder pair is symmetric about it, and the START/SELECT pair is symmetric as a pair) are witnessed per BODY against the mirrored position with the re-spacing allowed as a band (mirror-only ... mirror+spread), so a cluster or label pair left where it was loses even though its internals stayed rigid. Glyph survival (d-pad arrows, trigger/centre engravings, port-light faces) is graded per matched body on engraving PRESENCE -- a rebuilt glyph may split into a different number of faces (the reference D-pad drops 11->5 per button), so full credit starts at a quarter of the seed count and tapers to zero as the glyph is erased, and a body that vanished from the candidate scores zero for it; this catches a part that strips a feature the fp/reshape check cannot see. Half of that component is the per-body mean and half the worst body, so a stripped engraving cannot be hidden behind the 276 port/vent faces of the housing, and a candidate whose engraving bodies cannot be matched at all scores zero rather than full credit. The two 4-button diamonds are re-labelled against the seed by their button spacing (D-pad 14.8mm vs face buttons 19.8mm here) because the engraved-face count alone mislabels them once the remodel rebuilds the glyphs -- that spacing survives the swap, the mirror and the widen. No-unrequested-changes also checks the global X span -- over the MATCHED bodies only, so a stray body left in the document cannot inflate it -- against the candidate-own measured widening plus the same per-side remodel slack the Y/Z spans already get. Only over-growth beyond that is charged: in this part the X extremes belong to the housing (135.5mm off the plane, vs 88mm for the outermost control) and the reference legitimately re-shells it, which drifts its tips beyond the widening (measured live: 21.9mm of span growth against 15.0mm of pair growth, while the solution STL sidecar shows the intended 14.96mm), so charging the raw span difference was a false positive on the reference. A real X stretch is still caught (12mm per side -> c5 0.889), and a global X scale is caught by c1/c2 scaling with it and by Y/Z here. It also fingerprints the bodies that land in no role at all (here the two 2mm slivers c12/c13), which nothing else graded. Every component is CONTINUOUS: score = clamp(1 - (err-perfect)/(zero-perfect)) with per-component perfect/zero tolerances, no component pays out full credit for an empty measurement, summed with weights 1/1/1/0.5/0.25/0.25 = max_score 4.0. Rebuild health is a gate: a candidate with NEW feature-tree errors (vs the frozen seed census) scores 0 on every component rather than being measured against garbage. Harness grades the active SolidWorks document, or a path passed as argv[1]. Baseline frozen via `harness.py --capture-baseline prompt/input.SLDPRT`.\n"
output_modality = "cad"
accepted_output_formats = ["sldprt"]
reference = ["solution/solution.SLDPRT"]

[metadata.harness]
entrypoint = "harness/harness.py"
timeout_s = 300.0
requires_solidworks = true
requires_freecad = false
requires_llm = false

[[metadata.inputs]]
path = "environment/input.SLDPRT"
format = "sldprt"
role = "primary"

[[metadata.inputs]]
path = "tests/task/prompt/input.json"
format = "json"
role = "baseline_measurements"

[metadata.examples]
"examples/adversarial_widened_15mm_clusters_at_original_spacing/adversarial_widened_15mm_clusters_at_original_spacing.SLDPRT" = "widened 15 mm but clusters left at original spacing"
"examples/adversarial_unwidened_shell_with_correct_clusters/adversarial_unwidened_shell_with_correct_clusters.SLDPRT" = "clusters swapped correctly on an unwidened shell"
"examples/adversarial_widened_by_30mm/adversarial_widened_by_30mm.SLDPRT" = "widened 30 mm instead of 15"
"examples/adversarial_text_mirrored_incorrectly/adversarial_text_mirrored_incorrectly.SLDPRT" = "text mirrored incorrectly"
"examples/adversarial_only_one_button_cluster_mirrored/adversarial_only_one_button_cluster_mirrored.SLDPRT" = "only one button cluster moved across"
"examples/adversarial_missing_glyphs/adversarial_missing_glyphs.SLDPRT" = "widened and mirrored correctly but the button glyphs are missing"
"examples/adversarial_unrequested_change_elsewhere/adversarial_unrequested_change_elsewhere.SLDPRT" = "correct edit plus an unrequested change elsewhere on the part"
"examples/adversarial_feature_tree_with_errors/adversarial_feature_tree_with_errors.SLDPRT" = "feature tree riddled with rebuild errors and dangling references"

