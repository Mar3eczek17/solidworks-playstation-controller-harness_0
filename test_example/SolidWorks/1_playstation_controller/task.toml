schema_version = "1.4"

[task]
name = "storygold/solidworks-0001-playstation-controller"
version = "1.0.0"
description = "Make design edits while preserving design intent and feature tree references"
keywords = ["solidworks", "cad", "design_iteration"]

[[task.authors]]
name = "StoryGold"

[metadata]
complete = true
program = "SolidWorks"
category = "design_iteration"
units = "mm"
human_baseline_minutes = 240
max_score = 4

notes = "PS3 controller (replaces the retired Xbox variant, whose surfacing broke during the engineer's edit). Mirror plane is x=80.5mm, not x=0. Grading is geometry-only and id/name-independent: roles (housing/dpad/face_buttons/ sticks/triggers/bumpers/centre) are assigned geometrically per capture. Widen is graded as mirror-pair separation growth (+15mm), robust to the housing remodel. The naive-flip guard is the port-light glyph cluster (a one-sided housing feature re-found by its mirror-invariant area multiset; it must stay on its original side). PS symbol glyphs are left-right symmetric, so symbol chirality is UNVERIFIABLE by design. Harness grades the active SolidWorks document, or a path passed as argv[1]. Baseline frozen via `harness.py --capture-baseline prompt/input.SLDPRT`.\n"
output_modality = "cad"
accepted_output_formats = ["sldprt"]
reference = ["solution/solution.SLDPRT"]

[metadata.harness]
entrypoint = "harness/harness.py"
timeout_s = 300.0
requires_solidworks = true
requires_freecad = false
requires_llm = false

[[metadata.inputs]]
path = "environment/input.SLDPRT"
format = "sldprt"
role = "primary"

[[metadata.inputs]]
path = "tests/task/prompt/input.json"
format = "json"
role = "baseline_measurements"

[[metadata.scoring_components]]
name = "widened by 15 mm"
weight = 1.0

[[metadata.scoring_components]]
name = "clusters at mirrored positions"
weight = 1.0

[[metadata.scoring_components]]
name = "no new control interference"
weight = 1.0

[[metadata.scoring_components]]
name = "left-handed layout achieved"
weight = 1.0

[[metadata.scoring_components]]
name = "no unrequested changes"
weight = 0.0

[metadata.examples]
"examples/adversarial_widened_15mm_clusters_at_original_spacing.SLDPRT" = "widened 15 mm but clusters left at original spacing"
"examples/adversarial_unwidened_shell_with_correct_clusters.SLDPRT" = "clusters swapped correctly on an unwidened shell"
"examples/adversarial_widened_by_30mm.SLDPRT" = "widened 30 mm instead of 15"
"examples/adversarial_text_mirrored_incorrectly.SLDPRT" = "text mirrored incorrectly"
"examples/adversarial_only_one_button_cluster_mirrored.SLDPRT" = "only one button cluster moved across"
"examples/gpt5.SLDPRT" = "GPT-5 attempt"
"examples/adversarial_feature_tree_with_errors.SLDPRT" = "feature tree riddled with rebuild errors and dangling references"

